name: Dash Testing

on: push

jobs:

  changes_filter:
    name: Detect Relevant Path Changes
    runs-on: ubuntu-latest
    outputs:
      # This output will be 'true' if files in the 'table_related_paths' list changed, 'false' otherwise.
      table_paths_changed: ${{ steps.filter.outputs.table_related_paths }}
      background_cb_changed: ${{ steps.filter.outputs.background_paths }}
      backend_cb_changed: ${{ steps.filter.outputs.backend_paths }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Detect changed files for table tests
      id: filter   # Give an ID to this step to reference its outputs
      uses: dorny/paths-filter@v3
      with:
        filters: |
          table_related_paths:
            - 'components/dash-table/**'
            - 'dash/dash-renderer/**'
          background_paths:
            - 'dash/background_callback/**'
            - 'dash/dash-renderer/**'
            - 'dash/_callback.py'
            - 'dash/_callback_context.py'
            - 'tests/background_callback/**'
            - 'tests/async_tests/**'
            - 'requirements/**'
          backend_paths:
            - 'dash/backend/**'
            - 'tests/backend/**'

  backend-tests:
    name: Run Backend Callback Tests (Python ${{ matrix.python-version }})
    needs: [changes_filter]
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')) ||
      needs.changes_filter.outputs.backend_cb_changed == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']

    services:
      redis:
        image: redis:6
        ports:
        - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      REDIS_URL: redis://localhost:6379
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip wheel
        python -m pip install "setuptools<80.0.0"
        pip install -e ".[ci,testing]"

    - name: Run Backend Callback Tests
      run: |
        mkdir bgtests
        cp -r tests bgtests/tests
        cd bgtests
        touch __init__.py
        pytest --headless --nopercyfinalize tests/backend_tests -v -s
